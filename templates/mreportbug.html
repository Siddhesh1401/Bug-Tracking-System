<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Bug - BugTrack</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/mreportbug.css') }}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
  <div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">BugTrack</div>
        <button class="sidebar-toggle">
          <span class="material-symbols-outlined">chevron_left</span>
        </button>
      </div>

      <nav class="nav-menu">
        <a href="{{ url_for('auth.manager_dashboard') }}" class="nav-item">
          <span class="material-symbols-outlined">dashboard</span>
          <span class="nav-item-text">Dashboard</span>
        </a>
        <a href="{{ url_for('auth.report_bug') }}" class="nav-item active">
          <span class="material-symbols-outlined">bug_report</span>
          <span class="nav-item-text">Report Bug</span>
        </a>
        <a href="{{ url_for('auth.bug_status') }}" class="nav-item">
          <span class="material-symbols-outlined">query_stats</span>
          <span class="nav-item-text">Status</span>
        </a>
        <a href="{{ url_for('auth.profile') }}" class="nav-item">
          <span class="material-symbols-outlined">person</span>
          <span class="nav-item-text">Profile</span>
        </a>
        <a href="{{ url_for('auth.logout') }}" class="nav-item nav-logout">
          <span class="material-symbols-outlined">logout</span>
          <span class="nav-item-text">Logout</span>
        </a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <h1>Report a Bug</h1>
        <p>Submit details about the issue you've encountered</p>
      </div>

      <div class="report-form-container">
        <form class="report-form" method="POST" action="{{ url_for('auth.new_bug_report') }}" enctype="multipart/form-data">
          <div class="form-group">
            <label for="title">Bug Title*</label>
            <input type="text" id="title" name="title" placeholder="Brief description of the issue" required>
          </div>

          <div class="form-group">
            <label for="description">Description*</label>
            <textarea id="description" name="description" rows="6" placeholder="Provide detailed information about the bug..." required></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="type">Bug Type*</label>
              <select id="type" name="type" required>
                <option value="" disabled selected>Select bug type</option>
                <option value="functional">Functional</option>
                <option value="visual">Visual/UI</option>
                <option value="performance">Performance</option>
                <option value="security">Security</option>
                <option value="compatibility">Compatibility</option>
              </select>
            </div>

            <div class="form-group">
              <label for="priority">Priority*</label>
              <select id="priority" name="priority" required>
                <option value="" disabled selected>Select priority</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
                <option value="critical">Critical</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="steps">Steps to Reproduce</label>
            <textarea id="steps" name="steps" rows="4" placeholder="1. First step&#10;2. Second step&#10;3. ..."></textarea>
          </div>

          <div class="form-group">
            <label for="expected">Expected Behavior</label>
            <textarea id="expected" name="expected" rows="3" placeholder="What should happen..."></textarea>
          </div>

          <div class="form-group">
            <label for="actual">Actual Behavior</label>
            <textarea id="actual" name="actual" rows="3" placeholder="What actually happens..."></textarea>
          </div>
          
          <div class="form-group">
            <label for="screenshot">Screenshots (optional)</label>
            <div class="file-upload">
              <input type="file" id="screenshot" name="screenshot" multiple accept="image/*">
              <label for="screenshot" class="file-upload-label">
                <span class="material-symbols-outlined">upload</span>
                Choose files or drag & drop
              </label>
            </div>
            <div class="file-list" id="file-list"></div>
          </div>

          <div class="form-actions">
            <button type="reset" class="button secondary-button">Reset</button>
            <button type="submit" class="button primary-button">
              <span class="material-symbols-outlined">send</span>
              Submit Report
            </button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script>
    // Sidebar toggle functionality
    document.querySelector('.sidebar-toggle').addEventListener('click', function() {
      document.querySelector('.sidebar').classList.toggle('collapsed');
      document.querySelector('.main-content').classList.toggle('sidebar-collapsed');
    });
    
    // Display selected files
    document.getElementById('screenshot').addEventListener('change', function(e) {
      const fileList = document.getElementById('file-list');
      fileList.innerHTML = '';
      
      for (const file of this.files) {
        const item = document.createElement('div');
        item.className = 'file-item';
        item.innerHTML = `
          <span class="material-symbols-outlined">image</span>
          <span class="file-name">${file.name}</span>
          <button type="button" class="remove-file">
            <span class="material-symbols-outlined">close</span>
          </button>
        `;
        fileList.appendChild(item);
      }
    });
  </script>
</body>
</html>
