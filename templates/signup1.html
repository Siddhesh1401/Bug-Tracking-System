<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Step 1</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/signup1.css') }}">
    <style>
        /* Add these styles for the password toggle */
        .password-wrapper {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            width: 20px;
            height: 20px;
        }
        .toggle-password svg {
            width: 100%;
            height: 100%;
            fill: #666;
        }
    </style>
</head>
<body>
    <nav class="nav-header">
        <div class="logo-wrapper">
            <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/3cc32e3ac42bfc80cc0d3cff764d15d11bd5b1f4488c824dc21c5ef2e695fc99" alt="BugTracker Logo" class="logo-icon" />
            <h1 class="logo-text">BugTracker</h1>
        </div>
        <button id="signin-button">Sign In</button>

        <script>
            document.getElementById("signin-button").onclick = function() {
                window.location.href = "{{ url_for('auth.login') }}";
            };
        </script>
    </nav>

    <main class="main-content">
        <div class="signup-container">
            <h1 class="signup-title">Sign Up</h1>
            <h2 class="step-indicator">Step 1</h2>

            {% with messages = get_flashed_messages(with_categories=True) %}
                {% if messages %}
                    <div class="flash-message">
                        <ul>
                            {% for category, message in messages %}
                                <li class="{{ category }}">{{ message }}</li>
                            {% endfor %}
                        </ul>
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.signup') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label for="email">Email <span class="required">*</span></label>
                    <input type="email" id="email" name="email" class="input-field" placeholder="you@example.com" required />
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number <span class="required">*</span></label>
                    <input type="tel" id="phone" name="phone" class="input-field" placeholder="+91 XXXXX XXXXX" required />
                </div>

                <div class="form-group">
                    <label for="password">Password <span class="required">*</span></label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" class="input-field" placeholder="Enter a password" required minlength="6" />
                        <button type="button" class="toggle-password" aria-label="Show password">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 9a3 3 0 0 1 3 3 3 3 0 0 1-3 3 3 3 0 0 1-3-3 3 3 0 0 1 3-3m0-4.5c5 0 9.27 3.11 11 7.5-1.73 4.39-6 7.5-11 7.5S2.73 16.39 1 12c1.73-4.39 6-7.5 11-7.5M3.18 12a9.821 9.821 0 0 0 17.64 0 9.821 9.821 0 0 0-17.64 0z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword" class="input-field" placeholder="Re-enter your password" required />
                        <button type="button" class="toggle-password" aria-label="Show password">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 9a3 3 0 0 1 3 3 3 3 0 0 1-3 3 3 3 0 0 1-3-3 3 3 0 0 1 3-3m0-4.5c5 0 9.27 3.11 11 7.5-1.73 4.39-6 7.5-11 7.5S2.73 16.39 1 12c1.73-4.39 6-7.5 11-7.5M3.18 12a9.821 9.821 0 0 0 17.64 0 9.821 9.821 0 0 0-17.64 0z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="role">Role <span class="required">*</span></label>
                    <select id="role" name="role" class="dropdown-select" required>
                        <option value="">Select a role</option>
                        <option value="manager">Manager</option>
                        <option value="developer">Developer</option>
                    </select>
                </div>

                <button type="submit" class="submit-button">Next</button>
            </form>
        </div>
    </main>

    <script>
        // Add password toggle functionality
        document.querySelectorAll('.toggle-password').forEach(button => {
            button.addEventListener('click', function() {
                const input = this.parentElement.querySelector('input');
                const svg = this.querySelector('svg');
                
                if (input.type === 'password') {
                    input.type = 'text';
                    svg.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
                    this.setAttribute('aria-label', 'Hide password');
                } else {
                    input.type = 'password';
                    svg.innerHTML = '<path d="M12 9a3 3 0 0 1 3 3 3 3 0 0 1-3 3 3 3 0 0 1-3-3 3 3 0 0 1 3-3m0-4.5c5 0 9.27 3.11 11 7.5-1.73 4.39-6 7.5-11 7.5S2.73 16.39 1 12c1.73-4.39 6-7.5 11-7.5M3.18 12a9.821 9.821 0 0 0 17.64 0 9.821 9.821 0 0 0-17.64 0z"/>';
                    this.setAttribute('aria-label', 'Show password');
                }
            });
        });
    </script>
</body>
</html>
