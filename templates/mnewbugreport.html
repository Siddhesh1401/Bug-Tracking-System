<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Bug Report - BugTrack</title>
  <link rel="stylesheet" href="../static/css/mnewbugreport.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
  <div class="dashboard-container">
    <!-- Sidebar (for context, not visible when modal is open) -->
    <aside class="sidebar collapsed">
      <!-- Sidebar content -->
    </aside>

    <!-- Main Content (for context, blurred when modal is open) -->
    <main class="main-content sidebar-collapsed blurred">
      <!-- Dashboard content would go here -->
    </main>

    <!-- New Bug Modal Overlay -->
    <div class="modal-overlay active">
      <div class="modal-container">
        <div class="modal-header">
          <h2>New Bug Report</h2>
          <button class="close-modal">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        
        <div class="modal-body">
          <form class="bug-report-form">
            <div class="form-group">
              <label for="bug-title">Bug Title*</label>
              <input type="text" id="bug-title" placeholder="Brief description of the issue" required>
            </div>
            
            <div class="form-row">
              <div class="form-group">
                <label for="bug-type">Bug Type*</label>
                <select id="bug-type" required>
                  <option value="" disabled selected>Select type</option>
                  <option value="functional">Functional</option>
                  <option value="visual">Visual/UI</option>
                  <option value="performance">Performance</option>
                  <option value="security">Security</option>
                  <option value="compatibility">Compatibility</option>
                </select>
              </div>
              
              <div class="form-group">
                <label for="bug-priority">Priority*</label>
                <select id="bug-priority" required>
                  <option value="" disabled selected>Select priority</option>
                  <option value="low">Low</option>
                  <option value="medium">Medium</option>
                  <option value="high">High</option>
                  <option value="critical">Critical</option>
                </select>
              </div>
            </div>
            
            <div class="form-group">
              <label for="bug-description">Description*</label>
              <textarea id="bug-description" rows="4" placeholder="Provide detailed information about the bug..." required></textarea>
            </div>
            
            <div class="form-group">
              <label for="bug-steps">Steps to Reproduce</label>
              <textarea id="bug-steps" rows="3" placeholder="1. First step&#10;2. Second step&#10;3. ..."></textarea>
            </div>
            
            <div class="form-row">
              <div class="form-group">
                <label for="bug-environment">Environment</label>
                <input type="text" id="bug-environment" placeholder="Browser, OS, device, etc.">
              </div>
              
              <div class="form-group">
                <label for="bug-assignee">Assignee</label>
                <select id="bug-assignee">
                  <option value="" selected>Unassigned</option>
                  <option value="john">John Smith</option>
                  <option value="emma">Emma Wilson</option>
                  <option value="michael">Michael Brown</option>
                  <option value="olivia">Olivia Davis</option>
                </select>
              </div>
            </div>
            
            <div class="form-group">
              <label>Attachments</label>
              <div class="file-upload">
                <input type="file" id="bug-attachments" multiple accept="image/*">
                <label for="bug-attachments" class="file-upload-label">
                  <span class="material-symbols-outlined">upload</span>
                  Choose files or drag & drop
                </label>
              </div>
              <div class="file-list" id="file-list"></div>
            </div>
          </form>
        </div>
        
        <div class="modal-footer">
          <button class="button secondary-button">Cancel</button>
          <button class="button primary-button">
            <span class="material-symbols-outlined">bug_report</span>
            Submit Bug Report
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Basic modal toggle functionality
    document.querySelector('.close-modal').addEventListener('click', function() {
      document.querySelector('.modal-overlay').classList.toggle('active');
      document.querySelector('.main-content').classList.toggle('blurred');
    });
    
    // Display selected files
    document.getElementById('bug-attachments').addEventListener('change', function(e) {
      const fileList = document.getElementById('file-list');
      fileList.innerHTML = '';
      
      for (const file of this.files) {
        const item = document.createElement('div');
        item.className = 'file-item';
        item.innerHTML = `
          <span class="material-symbols-outlined">image</span>
          <span class="file-name">${file.name}</span>
          <button type="button" class="remove-file">
            <span class="material-symbols-outlined">close</span>
          </button>
        `;
        fileList.appendChild(item);
      }
    });
  </script>
</body>
</html>
