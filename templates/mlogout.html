<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logout - BugTrack</title>
 <!-- <link rel="stylesheet" href="{{ url_for('static', filename='css/mlogout.css') }}"> -->
  <link rel="stylesheet" href="../static/css/mlogout.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
  <div class="logout-container">
    <div class="logout-card">
      <div class="logout-icon">
        <span class="material-symbols-outlined">logout</span>
      </div>
      <h1>Logout Confirmation</h1>
      <p>Are you sure you want to logout from BugTrack?</p>

      <form method="POST" action="{{ url_for('auth.logout') }}">
        <div class="logout-actions">
          <!-- Cancel button redirects to the dashboard -->
          <a href="{{ url_for('auth.dashboard') }}" class="button secondary-button">Cancel</a>
          <!-- Submit button triggers the logout action -->
          <button type="submit" class="button primary-button">
            <span class="material-symbols-outlined">logout</span>
            Logout
          </button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
