<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="../static/css/forgotpassword.css">
    <script defer src="../static/js/forgotpassword.js"></script>
</head>
<body>

    <nav class="nav-header">
        <div class="logo-wrapper">
            <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/3cc32e3ac42bfc80cc0d3cff764d15d11bd5b1f4488c824dc21c5ef2e695fc99"
                alt="BugTracker Logo" class="logo-icon"/>
            <h1 class="logo-text">BugTracker</h1>
        </div>
        <button id="signin-button">Sign In</button>

        <script>
            document.getElementById("signin-button").addEventListener("click", function() {
                window.location.href = "{{ url_for('auth.login') }}";
            });
        </script>
    </nav>

    <main class="forgot-password-page">
        <section class="container">
            <h2 class="reset-title">Reset Password</h2>
            <p class="instructions">Enter your registered email to receive a verification code.</p>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=True) %}
                {% if messages %}
                    <div class="flash-message">
                        <ul>
                            {% for category, message in messages %}
                                <li class="{{ category }}">{{ message }}</li>
                            {% endfor %}
                        </ul>
                    </div>
                {% endif %}
            {% endwith %}

            <form class="reset-form" method="POST" action="{{ url_for('forgot_password.reset_password') }}">
                <!-- CSRF Token -->
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <!-- Email Input -->
                <div class="input-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required />
                    <button type="button" class="send-code" onclick="sendVerificationCode()">Send Code</button>
                </div>

                <!-- Verification Code Input -->
                <div class="input-group">
                    <label for="verification-code">Verification Code:</label>
                    <input type="text" id="verification-code" name="verification_code" placeholder="Enter code" maxlength="6" required />
                    <button type="button" class="verify-code" onclick="verifyCode()">Verify</button>
                </div>

                <!-- New Password -->
                <div class="input-group">
                    <label for="new-password">New Password:</label>
                    <input type="password" id="new-password" name="new_password" placeholder="New Password" required />
                    <span class="eye-icon" onclick="togglePassword('new-password')">&#128065;</span>
                </div>

                <!-- Confirm Password -->
                <div class="input-group">
                    <label for="confirm-password">Confirm Password:</label>
                    <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm Password" required />
                    <span class="eye-icon" onclick="togglePassword('confirm-password')">&#128065;</span>
                </div>

                <!-- Reset Button -->
                <button type="submit" class="reset-btn">Reset Password</button>
            </form>
        </section>
    </main>

    <script>
        // Toggle password visibility
        function togglePassword(id) {
            const input = document.getElementById(id);
            const icon = document.querySelector(`span[onclick="togglePassword('${id}')"]`);
            input.type = input.type === "password" ? "text" : "password";
            icon.textContent = input.type === "password" ? "👁️" : "🙈";
        }

        // Send verification code (AJAX request)
        function sendVerificationCode() {
            const email = document.getElementById("email").value;
            if (!email) {
                alert("Please enter your email address.");
                return;
            }

            fetch("{{ url_for('forgot_password.forgot_password') }}", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email })
            })
            .then(response => response.json())
            .then(data => alert(data.message))
            .catch(error => alert("Error sending code."));
        }

        // Verify code (AJAX request)
        function verifyCode() {
            const code = document.getElementById("verification-code").value;
            if (code.length !== 6) {
                alert("Please enter a valid 6-digit code.");
                return;
            }

            fetch("{{ url_for('forgot_password.verify_code') }}", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ verification_code: code })
            })
            .then(response => response.json())
            .then(data => alert(data.message))
            .catch(error => alert("Error verifying code."));
        }

        // Form submission validation
        document.querySelector(".reset-form").addEventListener("submit", function (e) {
            e.preventDefault(); // Prevent form submission

            const newPassword = document.getElementById("new-password").value;
            const confirmPassword = document.getElementById("confirm-password").value;

            if (newPassword !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            this.submit(); // Submit form if validation passes
        });
    </script>

</body>
</html>
